[package]
authors = ["Adam Sasine <adam.sasine@gmail.com>"]
categories = ["aerospace", "embedded", "hardware-support", "no-std"]
description = "Asynchronous driver for the BMP390 pressure sensor"
edition = "2024"
homepage = "https://github.com/asasine/bmp390"
keywords = ["embedded-hal", "async", "pressure", "sensor"]
license = "MIT"
name = "bmp390"
repository = "https://github.com/asasine/bmp390"
version = "0.4.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["defmt"]
defmt = ["dep:defmt"]
embassy-time = ["dep:embassy-time"]
sync = []

[dependencies]
device-driver = { version = "1.0.9", default-features = false }
defmt = { version = "1.1.1", optional = true }
embassy-time = { version = "0.4.0", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
libm = "0.2.8"
uom = { version = "0.36.0", default-features = false, features = [
    "f32",
    "si",
    "autoconvert",
] }
thiserror = { version = "2.0.19", default-features = false }

[dev-dependencies]
clap = { version = "4.5.26", features = ["derive"] }
defmt = { version = "1.1.1", features = ["unstable-test"] }
device-driver-mock = "0.1.1"
embedded-hal-mock = { version = "0.11.0", default-features = false, features = [
    "eh1",
    "embedded-hal-async",
] }
linux-embedded-hal = "0.4.0"
